[project]
name = "fluctuz"
version = "0.1.0"
description = "Fluctuz API: field report agent for agricultural extension workers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.7",
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "geoalchemy2>=0.18",
    "httpx>=0.28.1",
    "openai>=3.59.0",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.10",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.7",
    "hypothesis>=6.120",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "time-machine>=2.16",
]

[tool.ruff]
line-length = 100
# Code samples in docs are illustrations, not code to lint or format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
# app/ is an application, not a library: nothing to build or install.
package = false

[tool.pyright]
include = ["app", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
