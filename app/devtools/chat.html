<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator Chat · Fluctuz devtools</title>
<style>
  :root { --bg:#f4f5f2; --panel:#fff; --ink:#1d2320; --muted:#6b736e; --me:#dcf3d0; --bot:#fff;
          --line:#dfe3dc; --accent:#e8892c; --btn:#eef3fb; --btnink:#1f4f8f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151917; --panel:#1d2320; --ink:#e7ebe6; --muted:#98a39c; --me:#2c4a26;
            --bot:#262d29; --line:#333b36; --btn:#22324a; --btnink:#a9c8f5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
         background:var(--panel); border-inline:1px solid var(--line); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 6px; font-size:16px; }
  header p { margin:0 0 8px; color:var(--muted); font-size:13px; }
  .who { display:flex; gap:8px; flex-wrap:wrap; }
  .who label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:2px; }
  input { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px;
          background:var(--panel); color:var(--ink); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; white-space:pre-wrap;
         word-wrap:break-word; border:1px solid var(--line); }
  .in { align-self:flex-end; background:var(--me); }
  .out { align-self:flex-start; background:var(--bot); }
  .meta { font-size:11px; color:var(--muted); margin-top:4px; }
  .buttons { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .buttons button { font:inherit; font-size:13px; padding:5px 10px; border-radius:8px;
                    border:1px solid var(--line); background:var(--btn); color:var(--btnink);
                    cursor:pointer; }
  form.send { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  form.send input { flex:1; }
  .send.extra { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; font-size:13px; }
  .send.extra input { font:inherit; margin-left:6px; padding:5px 8px; }
  .send.extra button, form.send button { font:inherit; padding:6px 14px; border:0; border-radius:8px;
                     background:var(--accent); color:#1d2320; font-weight:600; cursor:pointer; }
  .err { color:#c0392b; font-size:13px; padding:0 16px 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Simulator chat bot</h1>
    <p>Pesan melewati jalur yang sama dengan webhook Telegram dan ditulis ke database yang dipakai
       API ini. Balasan tidak dikirim ke Telegram.</p>
    <div class="who">
      <label>Chat id<input id="chat" value="devtools-1" size="14"></label>
      <label>Nama profil<input id="name" value="Budi Santoso" size="16"></label>
    </div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="err" id="err" role="alert"></div>
  <form class="send" id="form">
    <input id="text" autocomplete="off" placeholder="Ketik pesan, mis. kode K7M2-9QXA" aria-label="Pesan">
    <button>Kirim</button>
  </form>
  <div class="send extra">
    <label>Lokasi (lat,lng)<input id="loc" value="-6.8214,107.1402" size="18"></label>
    <button type="button" id="send-loc">📍 Kirim lokasi</button>
    <button type="button" id="send-photo">📷 Kirim foto</button>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");

function bold(text) {
  const span = document.createElement("span");
  text.split(/(\*[^*\n]+\*)/).forEach((part) => {
    if (/^\*[^*\n]+\*$/.test(part)) {
      const b = document.createElement("b"); b.textContent = part.slice(1, -1); span.append(b);
    } else span.append(document.createTextNode(part));
  });
  return span;
}

function render(m) {
  const div = document.createElement("div");
  div.className = "msg " + m.direction;
  div.append(bold(m.text || ""));
  if (m.direction === "out" && m.buttons && m.buttons.length) {
    const row = document.createElement("div"); row.className = "buttons";
    m.buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.textContent = b.label;
      btn.onclick = () => send({ button: b.value }, b.label);
      row.append(btn);
    });
    div.append(row);
  }
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = m.workspace_id === undefined ? "mengirim…"
    : m.workspace_id ? "organisasi " + m.workspace_id.slice(0, 8) : "tanpa organisasi";
  div.append(meta);
  log.append(div);
  log.scrollTop = log.scrollHeight;
}

async function load() {
  log.textContent = "";
  const r = await fetch(`/devtools/telegram/${encodeURIComponent($("chat").value)}/messages`);
  if (!r.ok) return;
  const labels = {};  // a tapped button is stored as its value; show the label it had
  (await r.json()).messages.forEach((m) => {
    if (m.direction === "out") (m.buttons || []).forEach((b) => { labels[b.value] = b.label; });
    render(m.direction === "in" && labels[m.text] ? { ...m, text: labels[m.text] } : m);
  });
}

async function send(body, shown) {
  $("err").textContent = "";
  render({ direction: "in", text: shown, buttons: [], workspace_id: undefined });
  const r = await fetch("/devtools/telegram/messages", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: $("chat").value, name: $("name").value, ...body }),
  });
  if (!r.ok) { $("err").textContent = `Gagal (${r.status}): ` + (await r.text()).slice(0, 200); return; }
  const data = await r.json();
  await load();  // the stored history shows which organization each message now belongs to
  if (!data.replies.length) render({ direction: "out", text: "(bot tidak membalas)", buttons: [] });
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  send({ text }, text);
};
$("send-loc").onclick = () => {
  const [lat, lng] = $("loc").value.split(",").map((v) => Number(v.trim()));
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) { $("err").textContent = "Lokasi harus lat,lng"; return; }
  send({ location: { lat, lng, accuracy_m: 10 } }, `📍 ${lat}, ${lng}`);
};
$("send-photo").onclick = () => send({ photo: true }, "📷 (foto)");
$("chat").onchange = load;
load();
</script>
</body>
</html>
